<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS Voice — IT Helpdesk Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1e293b 0%, #0f172a 70%);
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
  }

  .header { text-align: center; margin-bottom: 8px; }
  h1 {
    color: #38bdf8;
    margin: 0;
    font-size: 32px;
    letter-spacing: 0.5px;
  }
  p.subtitle {
    color: #94a3b8;
    margin: 4px 0 0 0;
    font-size: 14px;
  }

  .mic-wrapper {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 32px 0 12px 0;
  }

  #talkBtn {
    position: relative;
    z-index: 2;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: #0f172a;
    border: none;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #talkBtn:hover:not(:disabled) { transform: scale(1.06); }
  #talkBtn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

  .pulse-ring {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(56, 189, 248, 0.35);
    animation: pulse 1.4s ease-out infinite;
    display: none;
  }
  .pulse-ring.active { display: block; }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  #status {
    color: #94a3b8;
    height: 22px;
    font-size: 14px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot-flash {
    display: inline-flex;
    gap: 3px;
  }
  .dot-flash span {
    width: 6px;
    height: 6px;
    background: #38bdf8;
    border-radius: 50%;
    animation: flash 1s infinite ease-in-out;
  }
  .dot-flash span:nth-child(2) { animation-delay: 0.2s; }
  .dot-flash span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes flash {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  #chatLog {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble-row {
    display: flex;
    flex-direction: column;
  }
  .bubble-row.user { align-items: flex-end; }
  .bubble-row.agent { align-items: flex-start; }

  .bubble {
    padding: 14px 18px;
    border-radius: 16px;
    max-width: 80%;
    line-height: 1.5;
    font-size: 15px;
    animation: fadeIn 0.3s ease;
  }
  .bubble.user {
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: #0f172a;
    border-bottom-right-radius: 4px;
  }
  .bubble.agent {
    background: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }

  .source-tag {
    font-size: 11px;
    margin-top: 5px;
    padding: 3px 10px;
    border-radius: 10px;
    display: inline-block;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .source-tag.database { background: #14532d; color: #86efac; }
  .source-tag.web { background: #1e3a8a; color: #93c5fd; }
  .source-tag.none { background: #3f3f46; color: #d4d4d8; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>🎙️ NEXUS Voice</h1>
    <p class="subtitle">Local IT Helpdesk Voice Agent — MCP powered</p>
  </div>

  <div class="mic-wrapper">
    <div class="pulse-ring" id="pulseRing"></div>
    <button id="talkBtn">🎤</button>
  </div>

  <div id="status"></div>
  <div id="chatLog"></div>

<script>
const talkBtn = document.getElementById("talkBtn");
const pulseRing = document.getElementById("pulseRing");
const chatLog = document.getElementById("chatLog");
const status = document.getElementById("status");

const sourceLabels = {
  database: "📊 From database",
  web: "🌐 From web search",
  none: "💬 Direct answer"
};

function addBubble(text, who, source) {
  const row = document.createElement("div");
  row.className = "bubble-row " + who;

  const bubble = document.createElement("div");
  bubble.className = "bubble " + who;
  bubble.textContent = text;
  row.appendChild(bubble);

  if (who === "agent" && source) {
    const tag = document.createElement("span");
    tag.className = "source-tag " + source;
    tag.textContent = sourceLabels[source] || "";
    row.appendChild(tag);
  }

  chatLog.appendChild(row);
  row.scrollIntoView({ behavior: "smooth", block: "end" });
}

function setStatus(text, animated) {
  status.innerHTML = "";
  const label = document.createElement("span");
  label.textContent = text;
  status.appendChild(label);

  if (animated) {
    const dots = document.createElement("span");
    dots.className = "dot-flash";
    dots.innerHTML = "<span></span><span></span><span></span>";
    status.appendChild(dots);
  }
}

talkBtn.addEventListener("click", async () => {
  talkBtn.disabled = true;
  pulseRing.classList.add("active");
  setStatus("Listening", true);

  try {
    const res = await fetch("/ask", { method: "POST" });

    pulseRing.classList.remove("active");
    setStatus("Thinking", true);

    const data = await res.json();

    if (data.question) addBubble(data.question, "user");
    addBubble(data.answer, "agent", data.source);
  } catch (err) {
    addBubble("Something went wrong: " + err, "agent", "none");
  }

  pulseRing.classList.remove("active");
  status.textContent = "";
  talkBtn.disabled = false;
});
</script>
</body>
</html>
